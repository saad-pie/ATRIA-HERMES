name: Hermes Agent Init & Cache Setup

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      session_id:
        description: "Session ID for log tracking"
        required: false
        default: "system_init"

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Send Progress Log
        if: github.event_name == 'workflow_dispatch'
        run: |
          curl -X POST "${{ secrets.VERCEL_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"session_id": "${{ github.event.inputs.session_id }}", "status": "Initializing Hermes workspace and caching dependencies...", "type": "step"}'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Hermes Installation
        id: cache-hermes
        uses: actions/cache@v4
        with:
          path: |
            ~/.hermes
            ~/.cache/pip
          key: ${{ runner.os }}-hermes-shared-v1
          restore-keys: |
            ${{ runner.os }}-hermes-shared-v1

      - name: Install Hermes Agent
        run: |
          curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash

      - name: Send Finalizing Log
        if: github.event_name == 'workflow_dispatch'
        run: |
          curl -X POST "${{ secrets.VERCEL_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"session_id": "${{ github.event.inputs.session_id }}", "status": "Agent successfully initialized, cached, and ready!", "type": "complete"}'
            
