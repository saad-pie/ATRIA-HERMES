name: Hermes Agent Ask Task

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Task prompt for Hermes"
        required: true
      session_id:
        description: "Session ID for real-time tracking"
        required: true

jobs:
  execute-agent-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore Master Environment Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/pip
            ~/.local/bin
            ~/.hermes
          key: hermes-shared-environment-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            hermes-shared-environment-cache-${{ runner.os }}-

      - name: Ensure Bin Paths & Smart Fallback
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.hermes/bin" >> $GITHUB_PATH
          
          # Consistency check: If cache missed or binary is missing, install inline safely
          if ! command -v hermes &> /dev/null && [ ! -f "$HOME/.hermes/bin/hermes" ]; then
            echo "Cache miss detected. Installing Hermes CLI fallback..."
            pip install hermes-agent || true
            curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash || true
          fi

      - name: Log Task Start
        run: |
          curl -s -X POST "${{ secrets.VERCEL_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"session_id": "${{ github.event.inputs.session_id }}", "status": "Analyzing request and selecting tools...", "type": "step"}' || true

      - name: Execute Hermes Task with Atria-Dawn-Preview
        env:
          ATRIA_API_KEY: ${{ secrets.ATRIA_API_KEY }}
          OPENAI_BASE_URL: "https://api.atria-asi.ai/v1"
          OPENAI_API_KEY: ${{ secrets.ATRIA_API_KEY }}
          HERMES_PROVIDER: "openai"
          HERMES_MODEL: "Atria-Dawn-Preview"
        run: |
          curl -s -X POST "${{ secrets.VERCEL_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"session_id": "${{ github.event.inputs.session_id }}", "status": "Generating output file with Atria-Dawn-Preview...", "type": "step"}' || true

          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:$PATH"

          # Write out provider configuration file for Atria endpoint mapping
          mkdir -p $HOME/.hermes
          cat << CONFIG > $HOME/.hermes/config.yaml
          provider: openai
          model: Atria-Dawn-Preview
          stream: false
          providers:
            openai:
              base_url: https://api.atria-asi.ai/v1
              api_key: ${{ secrets.ATRIA_API_KEY }}
          CONFIG

          # Run task and explicitly capture stdout/stderr to output.txt so it's never empty
          echo "=== HERMES EXECUTION LOG ===" > output.txt
          hermes chat -q "${{ github.event.inputs.prompt }}" >> output.txt 2>&1 || \
          hermes run --prompt "${{ github.event.inputs.prompt }}" --yolo >> output.txt 2>&1 || \
          python3 -m hermes chat -q "${{ github.event.inputs.prompt }}" >> output.txt 2>&1 || \
          echo "Error: Hermes execution commands failed to generate output." >> output.txt

          curl -s -X POST "${{ secrets.VERCEL_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"session_id": "${{ github.event.inputs.session_id }}", "status": "Attaching output file to chat stream...", "type": "step"}' || true

      - name: Send Output Back to Web UI
        run: |
          OUTPUT_CONTENT=$(cat output.txt | jq -sR .)
          curl -s -X POST "${{ secrets.VERCEL_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"session_id\": \"${{ github.event.inputs.session_id }}\", \"output\": $OUTPUT_CONTENT, \"type\": \"finish\"}" || true
            
