name: Hermes Agent Init & Cache Setup

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      session_id:
        description: "Session ID for log tracking"
        required: false
        default: "system_init"

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Send Progress Log
        if: github.event_name == 'workflow_dispatch'
        run: |
          curl -X POST "${{ secrets.VERCEL_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"session_id": "${{ github.event.inputs.session_id }}", "status": "Initializing Hermes workspace and caching toolchain...", "type": "step"}'

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hermes CLI & Dependencies
        run: |
          pip install --upgrade pip
          pip install hermes-agent browser-use playwright
          curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash || true
          
      - name: Export & Setup Paths
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.hermes/bin" >> $GITHUB_PATH
          mkdir -p $HOME/.hermes

      - name: Save Master Environment Cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/pip
            ~/.local/bin
            ~/.hermes
          key: hermes-shared-environment-cache-${{ runner.os }}-${{ github.sha }}

      - name: Send Finalizing Log
        if: github.event_name == 'workflow_dispatch'
        run: |
          curl -X POST "${{ secrets.VERCEL_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"session_id": "${{ github.event.inputs.session_id }}", "status": "Agent successfully initialized, cached, and ready!", "type": "complete"}'
            
